name: CI

on:
  push:
    branches: [main, "2.0.0-dev"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_ANSI_LOG: false
  NXF_DISABLE_CHECK_LATEST: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: PHI / credential guard
        run: python3 tools/dev/check_no_phi.py
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.18.4 -c
          "git config --global --add safe.directory /repo &&
          gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact -v"
      - name: ruff
        run: pipx run ruff check --select E9,F63,F7,F82 bin tests tools
      - uses: nf-core/setup-nextflow@v2
        with:
          version: latest-everything
      - name: nextflow lint
        run: nextflow lint .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest openpyxl
      - run: pytest -q

  stub:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["25.04.6", "25.10.2", "latest-everything"]
    steps:
      - uses: actions/checkout@v5
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}
      - run: nextflow run . -profile test_stub -stub-run
      - name: Command-line parameters of every type
        run: |
          nextflow run . -profile test_stub -stub-run --outdir results_cli \
            --nanopore_min_q 12 --min_nanopore_coverage 25.5 --fhir_validation_batch_size 2 \
            --plasmid_analysis false --skip_fhir_validation false --require_clinical false \
            --publish_clinical false --fail_on_validation_error false --performer_org_id 99000001
          test -e results_cli/qc/nanoplot/STUBONT_NanoStats.txt
          test ! -e results_cli/plasmid
          test ! -e results_cli/fhir/clinical
          test "$(ls results_cli/fhir/validation/validation_*.json | wc -l)" -gt 1
          test "$(tail -n +2 results_cli/fhir/validation/validation_summary.tsv | wc -l)" -eq \
               "$(ls results_cli/fhir/genomic/*.json results_cli/fhir/bundle/*.bundle.fhir.json 2>/dev/null | wc -l)"
      - name: Invalid parameters are rejected
        run: |
          rejected() {
            if nextflow run . -profile test_stub -stub-run --outdir results_bad "$1" "$2" > bad.log 2>&1; then exit 1; fi
            grep -qF -- "$1 ($2)" bad.log
          }
          rejected --nanopore_min_q twelve
          rejected --plasmid_analysis maybe
          rejected --amr_locate_min_identity 200

  test_docker:
    runs-on: ubuntu-latest
    needs: [pytest, stub]
    steps:
      - uses: actions/checkout@v5
      - uses: nf-core/setup-nextflow@v2
        with:
          version: latest-everything
      - name: HS11286 assembly end to end (Docker), validation must report 0 errors
        run: >-
          nextflow run . -profile test,docker
          --fhir_validation_batch_size 1 --fail_on_validation_error true --plasmid_analysis false
      - name: Check typing, AMR and validation
        run: |
          grep '"sequence_type": "ST11"' results_test/typing/HS11286_typing.json
          grep '"carbapenemase": "KPC-2"' results_test/typing/HS11286_typing.json
          grep '"text": "Extensively Drug-Resistant (XDR)"' results_test/fhir/genomic/HS11286.genomic.fhir.json
          cat results_test/fhir/validation/validation_summary.tsv
          awk -F'\t' 'NR > 1 && $2 != 0 {print; bad = 1} END {exit bad}' results_test/fhir/validation/validation_summary.tsv

  test_conda:
    runs-on: ubuntu-latest
    needs: [pytest, stub]
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
      - uses: nf-core/setup-nextflow@v2
        with:
          version: latest-everything
      - name: HS11286 assembly end to end (conda)
        shell: bash -el {0}
        run: nextflow run . -profile test,conda
      - name: Check typing
        run: |
          grep '"sequence_type": "ST11"' results_test/typing/HS11286_typing.json
          grep '"carbapenemase": "KPC-2"' results_test/typing/HS11286_typing.json
